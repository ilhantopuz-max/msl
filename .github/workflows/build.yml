name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:        # Actions sekmesinden elle de çalıştırılabilir

permissions:
  contents: write           # tag atıldığında Release oluşturabilmek için

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur (wrapper gerekmez)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Debug APK üret
        run: gradle assembleDebug --stacktrace

      - name: APK'yı Artifacts'e yükle
        uses: actions/upload-artifact@v4
        with:
          name: Masalin-Dunyasi-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Release oluştur (yalnızca v* etiketlerinde)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
